version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: menua_postgres
    restart: always
    environment:
      POSTGRES_USER: menua_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: menua_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - menua_network

  backend:
    build: ./apps/backend
    container_name: menua_backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/menua/documents:/var/menua/documents
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://menua_user:${POSTGRES_PASSWORD}@db:5432/menua_crm?schema=public
    depends_on:
      - db
    networks:
      - menua_network

  vitrine:
    build:
      context: ./apps/vitrine
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: menua_vitrine
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - menua_network

  admin:
    build:
      context: ./apps/admin
      args:
        - VITE_API_URL=
    container_name: menua_admin
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5173:8080"  # nginx-unprivileged écoute sur 8080 (non-root)
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - menua_network

  menua_nginx:
    image: nginx:alpine
    container_name: menua_nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker_nginx/conf.d/${NGINX_CONFIG:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - ./docker_nginx/certbot/www:/var/www/certbot
      - ./docker_nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
    depends_on:
      - vitrine
      - backend
    networks:
      - menua_network

volumes:
  postgres_data:

networks:
  menua_network:
    driver: bridge
