version: '3.8'

services:
  backend:
    build: ./apps/backend
    container_name: menua_backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./apps/backend/prisma:/app/prisma
      - menua_db_data:/app/data
      - /var/menua/documents:/var/menua/documents
    ports:
      - "4000:4000"
    env_file:
      - .env
    networks:
      - menua_network

  vitrine:
    build: ./apps/vitrine
    container_name: menua_vitrine
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - menua_network

  admin:
    build: ./apps/admin
    container_name: menua_admin
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5173:80"  # Map local port 5173 to nginx container port 80
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - menua_network

  menua_nginx:
    image: nginx:alpine
    container_name: menua_nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker_nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - ./docker_nginx/certbot/www:/var/www/certbot
      - ./docker_nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
    depends_on:
      - vitrine
      - backend
    networks:
      - menua_network

volumes:
  menua_db_data:

networks:
  menua_network:
    driver: bridge
