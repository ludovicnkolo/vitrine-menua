# ============================================================
#  MENUA CONSULTING — Docker Compose (VPS OVHcloud)
#  Contient Next.js + Nginx en Reverse Proxy
# ============================================================
version: '3.8'

services:
  menua_app:
    build: .
    container_name: menua_app
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Volume persistant pour la BDD locale (si SQLite)
      - menua_db_data:/app/data
      # Volume persistant et hors-ligne pour les documents sécurisés (KYC, Contrats)
      - menua_secure_docs:/var/menua/documents
    ports:
      - "3000:3000"
    networks:
      - menua_network

  menua_nginx:
    image: nginx:alpine
    container_name: menua_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      # Volumes pour Let's Encrypt / Certbot (HTTPS)
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - menua_app
    networks:
      - menua_network

volumes:
  menua_db_data:
  menua_secure_docs: # Ce volume garantit que les KYC/pièces d'identité ne sont JAMAIS dans le dossier public web

networks:
  menua_network:
    driver: bridge
