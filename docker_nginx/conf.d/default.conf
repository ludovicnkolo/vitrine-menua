# ============================================================
#  MENUA CONSULTING — Nginx Configuration (Production HTTPS)
# ============================================================

# ────────────────────────────────────────────────────────────
# SITE VITRINE (menuaconsulting.com)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name menuaconsulting.com www.menuaconsulting.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name menuaconsulting.com www.menuaconsulting.com;

    ssl_certificate /etc/nginx/ssl/live/menuaconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/menuaconsulting.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    location / {
        # Résolution DNS dynamique pour éviter l'erreur 502 quand le conteneur est recréé
        resolver 127.0.0.11 valid=10s;
        set $upstream_vitrine http://vitrine:3000;
        proxy_pass $upstream_vitrine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ────────────────────────────────────────────────────────────
# ESPACE ADMIN (admin.menuaconsulting.com)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.menuaconsulting.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.menuaconsulting.com;

    # Remarque: assurez-vous d'avoir généré le certificat SSL pour ce sous-domaine aussi
    ssl_certificate /etc/nginx/ssl/live/menuaconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/menuaconsulting.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        # Résolution DNS dynamique pour éviter l'erreur 502 quand le conteneur est recréé
        resolver 127.0.0.11 valid=10s;
        set $upstream_admin http://admin:80;
        proxy_pass $upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}