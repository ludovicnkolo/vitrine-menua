# MENUA CONSULTING - Nginx HTTPS configuration for production.

server {
    listen 80;
    listen [::]:80;
    server_name menuaconsulting.com www.menuaconsulting.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name menuaconsulting.com www.menuaconsulting.com;

    ssl_certificate /etc/nginx/ssl/live/menuaconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/menuaconsulting.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_backend http://backend:4000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        add_header Cache-Control "no-store" always;
    }

    error_page 502 /maintenance.html;
    location = /maintenance.html { root /usr/share/nginx/html; internal; }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream_vitrine http://vitrine:3000;
        proxy_pass $upstream_vitrine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        add_header Cache-Control "no-store" always;
    }
}

