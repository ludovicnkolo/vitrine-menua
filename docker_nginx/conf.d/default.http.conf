# MENUA CONSULTING - local HTTP configuration

server {
    listen 80;
    listen [::]:80;
    server_name menuaconsulting.com www.menuaconsulting.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_backend http://backend:4000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        add_header Cache-Control "no-store" always;
    }

    error_page 502 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream_vitrine http://vitrine:3000;
        proxy_pass $upstream_vitrine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        add_header Cache-Control "no-store" always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name crm-admin.menuaconsulting.com;

