<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Site en maintenance | Menua Consulting</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0c121e; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        .logo-container {
            margin-bottom: 50px;
        }
        .logo { 
            max-width: 250px; 
            height: auto;
        }
        .icon-container {
            margin-bottom: 30px;
        }
        .icon-container svg {
            width: 80px;
            height: 80px;
            stroke: #ffffff;
            stroke-width: 1.5;
            fill: none;
        }
        p { 
            font-size: 1.1rem; 
            color: #ffffff; 
            max-width: 600px; 
            line-height: 1.6; 
            margin-bottom: 40px;
        }
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
            width: 300px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .divider-dot {
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            margin: 0 15px;
        }
        .contact-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .contact-container svg {
            width: 30px;
            height: 30px;
            stroke: #ffffff;
            stroke-width: 1.5;
            fill: none;
            margin-bottom: 15px;
        }
        .contact-text {
            font-size: 1rem;
            color: #ffffff;
        }
    </style>
</head>
