# ============================================================
# Fichier de configuration SonarQube Cloud pour vitrine-menua
# ============================================================

# Identité du projet
sonar.projectKey=ludovicnkolo_vitrine-menua
sonar.projectName=vitrine-menua

# Encodage source (résout l'avertissement d'encodage)
sonar.sourceEncoding=UTF-8

# Version Python (résout l'avertissement de version Python)
sonar.python.version=3.10,3.11

# Exclusions : scripts utilitaires Python, node_modules, builds, fichiers générés
sonar.exclusions=**/*.py,**/node_modules/**,**/.next/**,**/dist/**,**/.git/**,**/build/**,**/coverage/**,**/scripts/*.py,apps/vitrine/scripts/**,generate_maintenance.py,fix_users.py,**/prisma/migrations/**

# Ne pas analyser les fichiers de configuration et les lockfiles
sonar.test.exclusions=**/node_modules/**,**/*.test.js,**/*.spec.js

# Langages principaux du projet (JS/TS/JSX/TSX)
sonar.language=js
