# ============================================================
# Fichier de configuration SonarQube Cloud pour vitrine-menua
# ============================================================

# Identité du projet
sonar.projectKey=ludovicnkolo_vitrine-menua
sonar.projectName=vitrine-menua

# Périmètre des sources à analyser (uniquement le code applicatif actif)
sonar.sources=apps/admin/src,apps/backend/src,apps/vitrine/src

# Encodage source (résout l'avertissement d'encodage)
sonar.sourceEncoding=UTF-8

# Version Python (résout l'avertissement de version Python)
sonar.python.version=3.10

# Exclusions strictes : lockfiles, fichiers de données, uploads, storage, builds, médias, fichiers générés
sonar.exclusions=**/*.py,**/node_modules/**,**/.next/**,**/dist/**,**/.git/**,**/build/**,**/coverage/**,**/scripts/**,**/prisma/migrations/**,**/package-lock.json,**/*lock*.json,apps/storage/**,apps/backend/uploads/**,apps/backend/backups/**,**/public/**,**/*.pdf,**/*.json,cypress/**,**/*.test.*,**/*.spec.*

# Ne pas analyser les fichiers de test
sonar.test.exclusions=**/node_modules/**,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts,**/*.test.jsx,**/*.spec.jsx,**/*.test.tsx,**/*.spec.tsx
